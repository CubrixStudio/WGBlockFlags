# WGBlockFlags Configuration
# Plugin version: 2.2.0
# All player-facing messages are in language.yml

# Debug mode - logs flag checks to console
# Useful for troubleshooting flag configurations
debug: false

# Cooldown for deny messages in seconds (prevents message spam)
# Set to 0 to send every time
message-cooldown: 2

# ============================================================
# Farm Zone Management
# ============================================================
farm:
  # Default ticks between forced crop growth attempts in farm regions.
  # 20 ticks = 1 second.  200 = 10 seconds.  400 = 20 seconds.
  # Per-region override: /rg flag <region> farm-grow-interval <ticks>
  grow-interval: 400

  # Minimum grow-interval allowed via per-region flag.
  # Prevents values that would cause excessive server load.
  min-grow-interval: 20

  # If true, auto-replant only fires when the crop was fully grown at break time.
  # Set to false to replant any broken crop regardless of its growth stage.
  replant-only-mature: true

  # If true, the normal item drops are suppressed when a crop is auto-replanted.
  # Prevents seed accumulation when auto-grow and auto-replant are both active.
  suppress-drops-on-replant: false

# ============================================================
# Mob Spawn Zone Management (requires MythicMobs 5.x)
# ============================================================
mob-spawn:
  # Default ticks between spawn cycles in mob zones.
  # 20 ticks = 1 second.  400 = 20 seconds.
  # Per-region override: /rg flag <region> mob-spawn-interval <ticks>
  spawn-interval: 400

  # Default maximum concurrent mobs per zone before spawning is suppressed.
  # Per-region override: /rg flag <region> mob-spawn-max <count>
  max-mobs: 5

  # Default number of mobs to attempt spawning per cycle.
  # Per-region override: /rg flag <region> mob-spawn-count <count>
  spawn-count: 1

  # Default minimum mob level (inclusive).
  # Per-region override: /rg flag <region> mob-spawn-level-min <level>
  default-level-min: 1

  # Default maximum mob level (inclusive).  Level is chosen randomly in [min, max].
  # Per-region override: /rg flag <region> mob-spawn-level-max <level>
  default-level-max: 1

  # Number of random positions to try when searching for a safe spawn location.
  # Increase if mobs frequently fail to spawn in regions with complex terrain.
  spawn-attempts: 20

# ============================================================
# Block Regeneration
# ============================================================
block-regen:
  # Default ticks before a broken block regenerates.
  # 20 ticks = 1 second.  1200 = 60 seconds.
  # Per-region override: /rg flag <region> block-regen-delay <ticks>
  default-delay: 1200
